# SFT2 consuming the DINO-aligned SFT1 4x4 query-state interface.
init:
  sft1_checkpoint: null  # final/hf_merged from qwen25vl_lora_k16_dinov2_grid4
  slot_projector: required_from_sft1_checkpoint

data:
  train_jsonl: train_all.jsonl
  val_jsonl: val_all.jsonl
  include_failed_rollouts: true
  forward_semantics: one_transition_prefix_per_sample

representation:
  grid_size: 4
  grid_tokens: 16
  qwen_hidden_dim: 2048
  state_dim: 1024
  ordering: row_major
  qwen: freeze
  slot_projector: freeze
  dino_teacher: forbidden

world_model:
  type: one_joint_spatial_transformer
  input: current_grid_plus_action
  output: complete_next_grid
  target: next_prefix_query_grid_stop_gradient
  depth: 4
  heads: 8
  mlp_dim: 2048

value:
  input: mean_pool_4x4_current_grid
  output: six_action_values

train:
  epochs: 10
  batch_size: 2
  grad_accum: 4
  wm_lr: 1.0e-4
  value_lr: 1.0e-4
  wm_weight: 1.0
  value_weight: 1.0
  max_length: 12000
  max_pixels: 100352
