# SFT2 k=1 control with per-rank B1 and global cross-rank SIGReg batch.

init:
  sft1_checkpoint: null
  wm_predictor_checkpoint: null

data:
  train_jsonl: train_all.jsonl
  val_jsonl: val_all.jsonl
  include_failed_rollouts: true

tuning:
  llm_tune: freeze
  vision_tune: full
  vision_ema: true
  vision_ema_decay: 0.999
  lora_r: 64
  lora_alpha: 128

train:
  epochs: 10
  # world8 时每个 SIGReg microbatch 使用 global B8；GA8 保持 effective batch 64。
  batch_size: 1
  grad_accum: 8
  lr_qwen_start: 1.0e-8
  lr_qwen_peak: 5.0e-7
  state_proj_lr: 1.0e-4
  wm_predictor_lr: 3.0e-4
  value_head_lr: 3.0e-4
  train_wm_predictor: true
  max_length: 12000
  max_pixels: 100352
  emb_dim: 1024
  history_size: 4
  # 当前 step 独占在线 Qwen/CE；H=4 的旧 state 来自本 epoch 在线 detached cache。
  batch_mode: trajectory_online_cache
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  checkpoint_interval_minutes: 20.0
  preprocess_cache_image_dtype: bfloat16
  preprocess_cache_image_shard_size: 128
  preprocess_cache_transition_shard_size: 256
  preprocess_cache_shard_lru: 2
  preprocess_workers: 8
  dataloader_workers: 4
  dataloader_prefetch_factor: 2

latent:
  token_count: 1
  query_mode: inject
  query_tune: adapter
  query_lr: 5.0e-5

loss:
  lambda_wm_start: 0.1
  lambda_wm_end: 1.0
  lambda_ce: 1.0
  lambda_value: 1.0
  lambda_sigreg: 0.1
  sigreg_num_proj: 1024
  sigreg_knots: 17
  value_gamma: 1.0

monitor:
  wandb: true
  checkpoint_metric: val_wm_mse
