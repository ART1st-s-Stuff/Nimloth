# Predictor capacity diagnostic E2: direct Qwen vision encoder tokens, 4-step autoregressive predictor.
# Qwen is frozen. Only TokenSetWMPredictor is trained.
# For 255x255 navigation frames with current Qwen processor settings, image_grid_thw=(1,18,18)
# and Qwen visual spatial merge gives K=81 output vision tokens.

experiment:
  group: representation_ablation
  name: e_qwen_vision_tokens_predictor_rollout4
  output_dir: null
  seed: 0

init:
  qwen_checkpoint: null
  wm_predictor_checkpoint: null
  value_head_checkpoint: null
  state_proj_checkpoint: null

data:
  train_jsonl: null
  val_jsonl: null
  split_policy: explicit_train_val
  include_failed_rollouts: true
  value_gamma: 1.0
  max_records: -1

representation:
  type: qwen_vision_tokens
  num_tokens: 81
  dim: 3584
  source: qwen
  projector: none
  compressor: null
  semantic_embedding:
    enabled: false
    source: instruction
    pooling: mean

predictor:
  type: token_transformer
  train: true
  history_size: 1
  depth: 4
  heads: 8
  hidden_dim: 1024

value_head:
  type: pooled_mlp
  train: false
  use_semantic_embedding: false
  hidden_dim: null

reconstruction:
  enabled: false
  type: simple_decoder
  condition_source: true_and_predicted
  image_size: 128
  upload_wandb_images: false
  save_samples: 0

train:
  target: predictor
  epochs: 1
  batch_size: 1
  lr: 1.0e-4
  resume: false
  save_interval: 500
  rollout_steps: 4
  max_length: 12000
  max_pixels: 602112
  attn_implementation: sdpa

eval:
  metrics: [predictor_multistep]
  rollout_depths: [1, 2, 3, 4]
  batch_size: 1
  max_batches: -1
  max_length: 12000
  max_pixels: 602112
  save_samples: 0
  attn_implementation: sdpa

wandb:
  enabled: false
  project: nimloth
  run_name: null
