# k=8/inject integration smoke for real task text, transcript replay, and rewards.

freeze:
  qwen: false
  state_proj: true

actor:
  lr: 1.0e-6
  entropy_coeff: 0.01
  clip_ratio: 0.2

predictor:
  lr: 1.0e-4
  emb_dim: 8192
  history_size: 4
  projector_hidden_dim: 8192
  rollout_steps: 1

value_head:
  lr: 1.0e-4
  rank_margin: 0.0
  lambda_rank: 0.0

rollout:
  eval_sets:
    - base_train
  history_window: 112
  max_think_tokens: 512
  # Seeds 30002/30003 are distinct StoveBurner/Bread task instructions.
  seed_offset: 30002
  env_timeout: 600

rl:
  iterations: 1
  envs_per_iteration: 2
  max_steps_per_episode: 2
  gamma: 0.99
  batch_size: 2
  temperature: 0.7
  top_p: 0.95

validation:
  enabled: false
  baseline: false
  interval: 100
  envs: 0

training:
  seed: 42
  log_interval: 1
  save_interval: 100
