# Mechanics-only k=8/inject dynamic rollout smoke from the Full8192 SFT2 policy.

freeze:
  qwen: false
  state_proj: true

actor:
  lr: 1.0e-6
  entropy_coeff: 0.01
  clip_ratio: 0.2

predictor:
  lr: 1.0e-4
  emb_dim: 8192
  history_size: 4
  projector_hidden_dim: 8192
  rollout_steps: 1

value_head:
  lr: 1.0e-4
  rank_margin: 0.1
  lambda_rank: 1.0

rollout:
  eval_sets:
    - base_train
  history_window: 4
  seed_offset: 30001
  env_timeout: 600

rl:
  iterations: 1
  envs_per_iteration: 2
  max_steps_per_episode: 1
  gamma: 0.99
  batch_size: 2
  temperature: 0.7
  top_p: 0.95

validation:
  enabled: false
  baseline: false
  interval: 100
  envs: 0

training:
  seed: 42
  log_interval: 1
  save_interval: 100
