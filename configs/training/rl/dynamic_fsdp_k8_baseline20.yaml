# Evaluation-only corrected k=8/inject heldout baseline. No optimizer step or
# checkpoint is permitted; this gate must pass before any new quality pilot.

freeze:
  qwen: false
  state_proj: true

actor:
  lr: 1.0e-6
  entropy_coeff: 0.01
  clip_ratio: 0.2

predictor:
  lr: 1.0e-4
  emb_dim: 8192
  history_size: 4
  projector_hidden_dim: 8192
  rollout_steps: 1

value_head:
  lr: 1.0e-4
  rank_margin: 0.0
  lambda_rank: 0.0

rollout:
  # Required to construct the trainer collector, but evaluation_only never uses it.
  eval_sets:
    - base_train
  history_window: 112
  max_think_tokens: 2048
  seed_offset: 30001
  env_timeout: 600

rl:
  iterations: 0
  envs_per_iteration: 0
  max_steps_per_episode: 20
  gamma: 0.99
  batch_size: 2
  temperature: 0.7
  top_p: 0.95

validation:
  enabled: true
  baseline: true
  interval: 1
  envs: 20
  max_steps_per_episode: 20
  eval_sets:
    - base
  seed_offset: 1
  temperature: 0.0
  top_p: 1.0
  history_window: 112
  max_think_tokens: 2048
  env_timeout: 600

training:
  evaluation_only: true
  seed: 42
  log_interval: 1
  save_interval: 100
