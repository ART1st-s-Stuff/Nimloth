# One-step end-to-end RL pipeline smoke.
# Rollout is produced separately from a verified *_train navigation dataset.

agent:
  prompt_template: nimloth-latent-action

freeze:
  state_proj: true

actor:
  lr: 0.000001
  entropy_coeff: 0.01
  clip_ratio: 0.2

predictor:
  lr: 0.0001
  emb_dim: 128
  history_size: 1

value_head:
  lr: 0.0001
  rank_margin: 0.1
  lambda_rank: 1.0

rl:
  iterations: 1
  envs_per_iteration: 4
  max_steps_per_episode: 2
  gamma: 0.99
  batch_size: 2

rollout:
  temperature: 0.7
  top_p: 0.95

validation:
  enabled: false
  interval: 1
  envs: 0

training:
  seed: 42
  log_interval: 1
  save_interval: 1
