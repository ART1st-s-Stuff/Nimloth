# Formal multi-iteration RL run using the GPU-validated H=2 planner semantics.

agent:
  prompt_template: nimloth-latent-action
  planning:
    enabled: true
    horizon: 2
    search_mode: exhaustive
    device: cuda:0

freeze:
  state_proj: true

gradient:
  representation_to_backbone: false
  backbone_lr: 0.000001
  backbone_weight_decay: 0.01

actor:
  enabled: true
  action_objective: distillation
  entropy_coeff: 0.0
  clip_ratio: 0.2
  credit_assignment: action
  max_response_tokens: 512
  planner_distillation_weight: 1.0
  reference_kl_loss_weight: 0.0

predictor:
  lr: 0.0001
  emb_dim: 1024
  history_size: 4
  lambda_sigreg: 0.0
  sigreg_num_proj: 1024
  sigreg_knots: 17
  train_wm: true

value_head:
  lr: 0.0001
  rank_margin: 0.1
  lambda_rank: 0.0

rl:
  iterations: 60
  envs_per_iteration: 8
  max_steps_per_episode: 20
  gamma: 1.0
  batch_size: 8
  truncated_bootstrap: zero

rollout:
  train_datasets:
    - base_train
    - common_sense_train
  temperature: 0.7
  top_p: 0.95

# Fresh vLLM rollout is external to the trainer. Held-out evaluation must use a
# separately collected artifact and is not silently aliased to training data.
validation:
  enabled: false
  interval: 5
  envs: 0
  checkpoint_metric: success_rate

training:
  seed: 42
  log_interval: 1
  # ID105 used about 23 GB per complete checkpoint. Six periodic checkpoints,
  # latest, and final fit the measured shared-filesystem budget.
  save_interval: 10

distributed:
  nodes: 4
  world_size: 4
  gpus_per_rank: 2
  rollout_tensor_parallel_size: 4
