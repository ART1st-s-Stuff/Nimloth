# Formal 60-iteration training run for the greedy H=2 objective.

agent:
  prompt_template: nimloth-latent-action
  planning:
    enabled: true
    horizon: 2
    search_mode: greedy
    device: cuda:0

freeze:
  state_proj: true

gradient:
  state_source: recompute
  representation_to_backbone: true
  backbone_lr: 0.000001
  backbone_weight_decay: 0.01

actor:
  enabled: false
  entropy_coeff: 0.0
  clip_ratio: 0.2
  credit_assignment: action
  max_response_tokens: 512
  reference_kl_loss_weight: 0.0

predictor:
  lr: 0.0001
  emb_dim: 1024
  history_size: 4
  lambda_wm: 1.0
  lambda_dino: 0.5
  lambda_sigreg: 0.0
  sigreg_num_proj: 1024
  sigreg_knots: 17
  train_wm: true

value_head:
  lr: 0.0001
  rank_margin: 0.1
  lambda_rank: 0.0

rl:
  iterations: 60
  envs_per_iteration: 8
  max_steps_per_episode: 20
  gamma: 1.0
  batch_size: 8
  truncated_bootstrap: zero

rollout:
  train_datasets:
    - base_train
    - common_sense_train
  temperature: 0.7
  top_p: 0.95

# Held-out policy evaluation is collected independently from immutable periodic
# checkpoints. Training JSONL must never be reused as validation evidence.
validation:
  enabled: false
  interval: 10
  envs: 0
  checkpoint_metric: success_rate

training:
  seed: 42
  log_interval: 1
  save_interval: 10

# Rollout needs four GPUs for vLLM TP4. Two two-GPU model-parallel DDP replicas
# are sufficient for the validated training memory boundary; four replicas only
# repeated the complete fresh batch and doubled resource use.
distributed:
  nodes: 2
  world_size: 2
  gpus_per_rank: 2
  rollout_tensor_parallel_size: 4
