# RL experiment: 60 iterations, val every 5, save every 10
# Dataset config matches VAGEN baseline (navigation base + common_sense).

# Qwen 模型和 tune mode 由 CLI 唯一负责。
agent:
  prompt_template: nimloth-latent-action

freeze:
  state_proj: true

# --- Actor (Qwen PPO) ---
actor:
  lr: 1e-6             # 2 orders of magnitude below predictor LR
  entropy_coeff: 0.05  # baseline value for comparison
  clip_ratio: 0.2

# --- Predictor (warm-start from SFT2 best/wm_predictor/) ---
predictor:
  lr: 0.0001
  emb_dim: 128
  history_size: 1   # must match SFT2 checkpoint (trained with history_size=1)

# --- Value head (warm-start from SFT2 best/value_head/) ---
value_head:
  lr: 0.0001
  rank_margin: 0.1
  lambda_rank: 1.0

# --- RL loop: 1 iteration = 1 global_step = 1 optimizer step ---
rl:
  iterations: 60
  envs_per_iteration: 8
  max_steps_per_episode: 20
  gamma: 0.99
  batch_size: 32

rollout:
  train_datasets:
    - base_train
    - common_sense_train
  eval_datasets:
    - base
    - common_sense
  temperature: 0.7
  top_p: 0.95

# --- Validation ---
validation:
  enabled: true
  interval: 1               # run val rollout every iteration
  envs: 16                  # 16 val episodes
  checkpoint_metric: success_rate

# --- Training ---
training:
  seed: 42
  log_interval: 1           # log every iteration
  save_interval: 5          # checkpoint every 5 iterations
