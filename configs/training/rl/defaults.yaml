# Online RL training defaults

# --- Qwen ---
qwen:
  model: Qwen/Qwen2.5-VL-3B-Instruct
  attn_implementation: flash_attention_2
  max_pixels: 3136

# --- Freeze strategy ---
freeze:
  qwen: true       # override to false to enable PPO
  state_proj: true

# --- Actor (Qwen PPO) ---
actor:
  lr: 1e-6
  entropy_coeff: 0.0   # 0 = no entropy bonus (backward compatible)
  clip_ratio: 0.2

# --- Predictor ---
predictor:
  lr: 1e-3
  emb_dim: 128           # WM embedding dimension
  history_size: 4        # ARPredictor context frames
  rollout_steps: 1       # training rollout steps (start with single-step)

# --- Value head ---
value_head:
  lr: 1e-3
  rank_margin: 0.1     # margin for ranking loss (0 → regression only)
  lambda_rank: 0.0     # 0 = pure regression; set > 0 for ranking term

# --- Direct environment rollout ---
# The connected env server must actually provide these training datasets.
rollout:
  eval_sets:
    - base_train
    - common_sense_train
  history_window: 4          # current observation + up to 4 real history images
  seed_offset: 0             # deterministic cursor; resume advances by completed iterations
  env_timeout: 180           # keep below the default NCCL collective watchdog

# --- RL loop (1 iteration = 1 global_step = 1 optimizer step) ---
rl:
  iterations: 1000
  envs_per_iteration: 8     # episodes collected per iteration
  max_steps_per_episode: 20
  gamma: 0.99
  batch_size: 32
  temperature: 1.0           # applied to rollout and PPO action log-probs
  top_p: 1.0                 # restricts sampling only

# --- Fixed heldout validation ---
validation:
  # When enabled, CLI builds a separate collector. *_train datasets are
  # rejected, and its seed cursor resets before every evaluation.
  enabled: false
  baseline: false
  interval: 50
  envs: 16
  max_steps_per_episode: 20
  eval_sets:
    - base
  seed_offset: 1
  temperature: 0.0
  top_p: 1.0
  history_window: 4
  env_timeout: 180

# --- Training / output ---
training:
  seed: 42
  log_interval: 1           # log every iteration
  save_interval: 50         # iterations between checkpoints
  output_dir: null          # set via CLI --output-dir
