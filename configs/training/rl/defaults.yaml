# Online RL training defaults

# --- Qwen ---
qwen:
  model: Qwen/Qwen2.5-VL-3B-Instruct
  attn_implementation: flash_attention_2
  max_pixels: 3136

# --- Freeze strategy ---
freeze:
  qwen: true       # override to false to enable PPO
  state_proj: true

# --- Actor (Qwen PPO) ---
actor:
  lr: 1e-6
  entropy_coeff: 0.0   # 0 = no entropy bonus (backward compatible)
  clip_ratio: 0.2
  use_kl_loss: false
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  use_kl_in_reward: false
  kl_reward_coef: 0.001
  kl_reward_type: kl

# --- Advantage estimator / critic ---
algorithm:
  # turn_mc preserves the historical action-value pathway; masked_gae matches
  # VAGEN's selectable token-level navigation estimator.
  adv_estimator: turn_mc       # turn_mc | masked_gae
  gamma: 1.0
  lam: 1.0
  reward_placement: per_turn   # final | per_turn

critic:
  backend: independent_qwen
  lr: 1.0e-5
  micro_batch_size: 1
  cliprange_value: 0.5
  gradient_checkpointing: true

# --- Predictor ---
predictor:
  lr: 1e-3
  emb_dim: 128           # WM embedding dimension
  history_size: 4        # ARPredictor context frames
  rollout_steps: 1       # training rollout steps (start with single-step)

# --- Value head ---
value_head:
  lr: 1e-3
  rank_margin: 0.1     # margin for ranking loss (0 → regression only)
  lambda_rank: 0.0     # 0 = pure regression; set > 0 for ranking term

# --- Direct environment rollout ---
# The connected env server must actually provide these training datasets.
rollout:
  eval_sets:
    - base_train
    - common_sense_train
  history_window: 112        # preserves every SFT teacher-forced20-turn prefix
  max_think_tokens: 512      # historical VAGEN response_length_per_turn
  seed_offset: 0             # deterministic cursor; resume advances by completed iterations
  env_timeout: 180           # keep below the default NCCL collective watchdog

# --- RL loop (one PPO epoch; every transition is consumed in microbatches) ---
rl:
  iterations: 1000
  envs_per_iteration: 8     # episodes collected per iteration
  max_steps_per_episode: 20
  gamma: 1.0
  batch_size: 32            # transition microbatch size, not a subsample count
  temperature: 1.0           # applied to rollout and PPO action log-probs
  top_p: 1.0                 # restricts sampling only

# --- Fixed heldout validation ---
validation:
  # When enabled, CLI builds a separate collector. *_train datasets are
  # rejected, and its seed cursor resets before every evaluation.
  enabled: false
  baseline: false
  interval: 50
  envs: 16
  max_steps_per_episode: 20
  eval_sets:
    - base
  seed_offset: 1
  temperature: 0.0
  top_p: 1.0
  history_window: 112
  max_think_tokens: 512
  env_timeout: 180

# --- Training / output ---
training:
  seed: 42
  log_interval: 1           # log every iteration
  save_interval: 50         # iterations between checkpoints
  output_dir: null          # set via CLI --output-dir
