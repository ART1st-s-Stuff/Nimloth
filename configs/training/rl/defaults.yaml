# Online RL training defaults

# Qwen 模型、attention 和图片预算由 CLI 唯一负责。
# --llm-tune/--vision-tune 决定可训练参数；gradient/actor 决定梯度来源。
agent:
  prompt_template: nimloth-latent-action
  thought: What should I do next?
  # 每个真实 env step 只运行一次 Qwen；候选动作序列全部由 WM 在 latent 空间模拟。
  planning:
    enabled: true
    horizon: 4
    beam_width: 8

freeze:
  state_proj: true

# WM/value/SIGReg 默认共同训练 Backbone；关闭后只训练 WM 侧可训练参数。
gradient:
  representation_to_backbone: true
  backbone_lr: 1e-6

# --- Actor (Qwen PPO) ---
actor:
  enabled: false          # PPO 是否启用；与 Backbone 是否接收表征梯度独立
  entropy_coeff: 0.0   # 0 = no entropy bonus (backward compatible)
  clip_ratio: 0.2
  # action: only sampled action token; turn: sampled CoT and action share step credit.
  credit_assignment: action
  max_reasoning_tokens: 64

# --- Predictor ---
predictor:
  lr: 1e-3
  emb_dim: 128           # WM embedding dimension
  history_size: 4        # ARPredictor context frames
  lambda_sigreg: 0.1     # LeWM representation regularization
  sigreg_num_proj: 1024
  sigreg_knots: 17

# --- Value head ---
value_head:
  lr: 1e-3
  rank_margin: 0.1     # margin for ranking loss (0 → regression only)
  lambda_rank: 0.0     # 0 = pure regression; set > 0 for ranking term

# --- Direct environment rollout ---
# The connected env server must actually provide these training datasets.
rollout:
  train_datasets:
    - base_train
    - common_sense_train
  eval_datasets:
    - base
    - common_sense
  temperature: 1.0
  top_p: 1.0

# --- RL loop (1 iteration = 1 global_step = 1 optimizer step) ---
rl:
  iterations: 1000
  envs_per_iteration: 8     # episodes collected per iteration
  max_steps_per_episode: 20
  gamma: 0.99
  batch_size: 32

# --- Validation ---
validation:
  enabled: true
  interval: 50              # run validation every N iterations
  envs: 16                  # number of envs for validation rollout
  checkpoint_metric: success_rate

# --- Training / output ---
training:
  seed: 42
  log_interval: 1           # log every iteration
  save_interval: 50         # iterations between checkpoints
