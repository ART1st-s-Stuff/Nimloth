# Formal H=1 PlannerPolicyHead PPO from corrected SFT2 epoch 1 through global
# step 20 on two 4-GPU nodes, followed by one standard held-out evaluation.

agent:
  prompt_template: nimloth-latent-action
  planning:
    enabled: true
    horizon: 1
    search_mode: policy
    device: cuda:0

freeze:
  state_proj: true

gradient:
  state_source: recompute
  representation_to_backbone: true
  backbone_lr: 0.000001
  backbone_weight_decay: 0.01

actor:
  enabled: false
  entropy_coeff: 0.0
  clip_ratio: 0.2
  credit_assignment: action
  max_response_tokens: 512
  max_state_tokens: 16384
  reference_kl_loss_weight: 0.0

predictor:
  lr: 0.0001
  emb_dim: 1024
  history_size: 1
  lambda_wm: 1.0
  lambda_dino: 0.5
  lambda_sigreg: 0.0
  sigreg_num_proj: 1024
  sigreg_knots: 17
  train_wm: true

value_head:
  lr: 0.0001
  rank_margin: 0.1
  lambda_rank: 0.0

planner_policy:
  enabled: true
  lr: 0.0001
  clip_ratio: 0.2
  entropy_coeff: 0.01
  temperature: 1.0
  ppo_epochs: 4

rl:
  iterations: 20
  envs_per_iteration: 16
  max_steps_per_episode: 20
  gamma: 1.0
  batch_size: 16
  truncated_bootstrap: zero

rollout:
  train_datasets:
    - base_train
    - common_sense_train
  eval_datasets:
    - base
    - common_sense
  temperature: 0.7
  top_p: 0.95
  max_episode_attempts: 3

validation:
  enabled: false
  external: true
  interval: 20
  envs: 120
  checkpoint_metric: success_rate

training:
  seed: 42
  log_interval: 1
  save_interval: 10

distributed:
  nodes: 2
  world_size: 4
  gpus_per_rank: 2
  rollout_tensor_parallel_size: 4
