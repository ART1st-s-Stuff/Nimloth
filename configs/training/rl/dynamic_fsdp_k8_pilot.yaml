# Corrected k=8/inject protocol config. Do not launch a quality pilot until the
# separate fixed-20 heldout baseline passes task/prompt/reward validation.

freeze:
  qwen: false
  state_proj: true

actor:
  lr: 1.0e-6
  entropy_coeff: 0.01
  clip_ratio: 0.2
  use_kl_loss: true
  kl_loss_coef: 0.001
  kl_loss_type: low_var_kl
  use_kl_in_reward: false
  kl_reward_coef: 0.001
  kl_reward_type: kl

predictor:
  lr: 1.0e-4
  emb_dim: 8192
  history_size: 4
  projector_hidden_dim: 8192
  rollout_steps: 1

value_head:
  lr: 1.0e-4
  # Retained for the selectable turn_mc estimator only.
  rank_margin: 0.0
  lambda_rank: 0.0

algorithm:
  # Matches the checked VAGEN navigation run.sh override.
  adv_estimator: masked_gae
  gamma: 1.0
  lam: 1.0
  reward_placement: final

critic:
  backend: independent_qwen
  lr: 1.0e-5
  micro_batch_size: 1
  cliprange_value: 0.5
  gradient_checkpointing: true

rollout:
  # Training is restricted to the actual 1200-task training dataset.
  eval_sets:
    - base_train
  # SFT1/SFT2 teacher-forcing prefixes preserve complete trajectories. A large
  # window keeps all20 turns (VAGEN rollout generation itself used window_size=5).
  history_window: 112
  # User-requested diagnostic ceiling; the source collector used512 per turn.
  max_think_tokens: 2048
  seed_offset: 30001
  env_timeout: 600

rl:
  # batch_size is a memory microbatch; every collected transition is consumed.
  # Long 20-turn multimodal actor recompute exceeded 79GiB at2 even though the
  # short semantic smoke fit. Use1 until a direct long-history gate proves2.
  iterations: 20
  envs_per_iteration: 8
  max_steps_per_episode: 20
  gamma: 1.0
  batch_size: 1
  temperature: 0.7
  top_p: 0.95

validation:
  enabled: true
  baseline: true
  interval: 5
  envs: 20
  max_steps_per_episode: 20
  # base.json contains 60 heldout tasks/scenes and is disjoint from base_train.
  eval_sets:
    - base
  seed_offset: 1
  temperature: 0.0
  top_p: 1.0
  history_window: 112
  max_think_tokens: 2048
  env_timeout: 600

training:
  seed: 42
  log_interval: 1
  save_interval: 5
  stop_if_no_success_by_iteration: 5
