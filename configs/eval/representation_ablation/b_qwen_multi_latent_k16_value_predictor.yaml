# Phase-2 template B: multi <|latent_state|> token-set representation (K=16).
# Requires token_transformer predictor/value checkpoints trained for K=16.

experiment:
  group: representation_ablation
  name: b_qwen_multi_latent_k16_value_predictor
  output_dir: null
  seed: 0

init:
  vagen_checkpoint: /project/peilab/hligb/vagen-navigation/checkpoints/vagen_navigation_repro/navigation_base_8gpu_paper_repro_20260621/global_step_300
  sft2_checkpoint: null
  qwen_checkpoint: null
  # Optional per-token projector. If null, Qwen hidden size must match token predictor emb_dim.
  state_proj_checkpoint: null
  wm_predictor_checkpoint: null
  value_head_checkpoint: null
  decoder_checkpoint: null

data:
  train_jsonl: null
  val_jsonl: null
  split_policy: explicit_train_val
  include_failed_rollouts: true
  value_gamma: 1.0
  max_records: -1

representation:
  type: qwen_multi_latent
  num_tokens: 16
  dim: 1024
  source: qwen
  projector: linear
  compressor: null
  semantic_embedding:
    enabled: false
    source: instruction
    pooling: mean

predictor:
  type: token_transformer
  train: false
  history_size: 4
  depth: 4
  heads: 8
  hidden_dim: 1024

value_head:
  type: pooled_mlp
  train: false
  use_semantic_embedding: false
  hidden_dim: null

reconstruction:
  enabled: false
  type: simple_decoder
  condition_source: true_and_predicted
  image_size: 255
  upload_wandb_images: false
  save_samples: 0

train:
  target: eval_only
  batch_size: 1
  max_length: 14000
  max_pixels: 602112
  attn_implementation: sdpa

eval:
  metrics:
    - value_topk
    - value_ranking
    - value_calibration
    - predictor_multistep
  rollout_depths: [1, 2, 4, 8]
  planner: beam_search
  batch_size: 1
  max_batches: -1
  max_length: 14000
  max_pixels: 602112
  save_samples: 0
  attn_implementation: sdpa

wandb:
  enabled: false
  project: nimloth
  run_name: null
