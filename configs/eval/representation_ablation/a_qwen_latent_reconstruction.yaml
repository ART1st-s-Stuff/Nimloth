# Phase-1 baseline A reconstruction strips for current single <|latent_state|> representation.
# Requires a WMImageDecoder checkpoint under init.decoder_checkpoint.

experiment:
  group: representation_ablation
  name: a_qwen_latent_reconstruction
  output_dir: null
  seed: 0

init:
  vagen_checkpoint: /project/peilab/hligb/vagen-navigation/checkpoints/vagen_navigation_repro/navigation_base_8gpu_paper_repro_20260621/global_step_300
  # Optional: set this to a standard SFT2 checkpoint dir to derive qwen/state_proj/wm/value paths.
  sft2_checkpoint: null
  qwen_checkpoint: null
  state_proj_checkpoint: null
  wm_predictor_checkpoint: null
  value_head_checkpoint: null
  decoder_checkpoint: null

data:
  train_jsonl: null
  val_jsonl: null
  split_policy: explicit_train_val
  include_failed_rollouts: true
  value_gamma: 1.0
  max_records: -1

representation:
  type: qwen_latent
  num_tokens: 1
  dim: 1024
  source: qwen
  projector: linear
  compressor: null
  semantic_embedding:
    enabled: false
    source: instruction
    pooling: mean

predictor:
  type: lewm_ar
  train: false
  history_size: 4
  depth: 6
  heads: 16
  hidden_dim: 1024

value_head:
  type: mlp
  train: false
  use_semantic_embedding: false
  hidden_dim: null

reconstruction:
  enabled: true
  type: simple_decoder
  condition_source: true_and_predicted
  image_size: 255
  upload_wandb_images: false
  save_samples: 16

train:
  target: eval_only
  batch_size: 1
  max_length: 12000
  max_pixels: 602112
  attn_implementation: sdpa

eval:
  metrics:
    - reconstruction_strips
    - predictor_multistep
  rollout_depths: [1, 2, 4, 8]
  planner: beam_search
  batch_size: 1
  max_batches: -1
  max_length: 12000
  max_pixels: 602112
  save_samples: 16
  attn_implementation: sdpa

wandb:
  enabled: false
  project: nimloth
  run_name: null
